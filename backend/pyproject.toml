[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evonids-backend"
version = "0.1.0"
description = "EvoNIDS FastAPI backend, ingestion and rule evaluation foundation"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]
ml = [
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "torch>=2.2,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Keep the pre-0.16 default rule set explicit so Ruff upgrades cannot silently
# expand CI from correctness checks into hundreds of new style checks.
select = ["E4", "E7", "E9", "F"]
