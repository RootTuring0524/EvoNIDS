[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evonids-backend"
version = "0.1.1"
description = "EvoNIDS FastAPI backend, ingestion and rule evaluation foundation"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]
ml = [
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "torch>=2.2,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Keep the pre-0.16 default rule set explicit so Ruff upgrades cannot silently
# expand CI from correctness checks into hundreds of new style checks.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
# Third-party packages without type stubs are treated as Any instead of
# blocking the gate; first-party code must stay clean.
ignore_missing_imports = true
show_error_codes = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Installed but untyped data-science packages: analyzed as Any.
module = ["pandas.*", "sklearn.*", "joblib", "torch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# TabularAutoEncoder is a factory class whose __new__ returns a dynamically
# built torch.nn.Module subclass (torch is imported lazily so the API still runs
# without the ML extra). mypy 1.x resolves attributes against the class object
# rather than the __new__ return type, so silence exactly those two diagnostics
# here instead of blanketing the module.
module = ["app.services.autoencoder"]
disable_error_code = ["attr-defined", "operator"]
