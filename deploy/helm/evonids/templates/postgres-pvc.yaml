{{- /*
  Persistent volume claim for the PostgreSQL data directory.
  Rendered only when the chart manages storage (persistence.enabled and no
  existingClaim). Reuse an existing claim instead via
  postgres.persistence.existingClaim.
*/ -}}
{{- if and .Values.postgres.persistence.enabled (not .Values.postgres.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "evonids.postgresPvcFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "evonids.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.postgres.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size | quote }}
{{- end }}
