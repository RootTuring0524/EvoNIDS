{{- /*
  HorizontalPodAutoscalers for api and web (autoscaling/v2, requires
  metrics-server). api HPA is off by default — see values.yaml comments: the
  training worker is an in-process loop claiming `queued` runs without row
  locks (docs/adr/0004-in-process-training-worker.md) and the data PVC
  defaults to ReadWriteOnce, so >1 api replicas needs a RWX volume and
  accepting those constraints.
*/ -}}
{{- if .Values.api.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "evonids.apiFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "evonids.componentLabels" (dict "ctx" $ "component" "api") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "evonids.apiFullname" . }}
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if and .Values.web.autoscaling.enabled .Values.api.autoscaling.enabled }}
---
{{- end }}
{{- if .Values.web.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "evonids.webFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "evonids.componentLabels" (dict "ctx" $ "component" "web") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "evonids.webFullname" . }}
  minReplicas: {{ .Values.web.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.web.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.web.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
