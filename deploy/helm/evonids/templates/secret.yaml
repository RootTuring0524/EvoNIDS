{{- /*
  Secret manifest. Values-driven; never hardcode credentials in files.
  Canonical keys (used by every deployment via secretKeyRef):
    admin-token        -> EVONIDS_ADMIN_API_TOKEN / NUXT_BACKEND_ADMIN_TOKEN
    sensor-token       -> EVONIDS_SENSOR_INGEST_TOKEN / NUXT_SENSOR_INGEST_TOKEN
    analyst-token      -> EVONIDS_ANALYST_API_TOKEN        (optional)
    postgres-password  -> POSTGRES_PASSWORD                (postgres + api DSN)
    console-password   -> NUXT_CONSOLE_PASSWORD
    deepseek-api-key   -> NUXT_DEEPSEEK_API_KEY            (optional)

  External-secrets alternative: set secrets.existingSecret to the name of a
  Secret (from external-secrets, SealedSecrets, SOPS, or a manually created
  object) that contains the same canonical keys; the chart then renders no
  Secret of its own.
*/ -}}
{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "evonids.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "evonids.labels" . | nindent 4 }}
type: Opaque
data:
  admin-token: {{ .Values.secrets.adminApiToken | b64enc | quote }}
  sensor-token: {{ .Values.secrets.sensorIngestToken | b64enc | quote }}
  analyst-token: {{ .Values.secrets.analystApiToken | b64enc | quote }}
  postgres-password: {{ .Values.secrets.postgresPassword | b64enc | quote }}
  console-password: {{ .Values.secrets.consolePassword | b64enc | quote }}
  deepseek-api-key: {{ .Values.secrets.deepseekApiKey | b64enc | quote }}
{{- end }}
