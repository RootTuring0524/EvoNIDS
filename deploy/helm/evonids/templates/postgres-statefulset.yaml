{{- /*
  postgres StatefulSet — single-instance pgvector primary.
  One static PVC (postgres-pvc.yaml or an existingClaim) is mounted at
  /var/lib/postgresql/data (PGDATA of the pg17 image). Replicas are fixed at
  1: this chart intentionally does not implement replication/HA — use a
  managed PostgreSQL or a dedicated operator for that, and route the api to it
  via api.env.databaseUrlOverride / secrets.postgresPassword.
*/ -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "evonids.postgresFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "evonids.componentLabels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
spec:
  serviceName: {{ include "evonids.postgresFullname" . }}
  replicas: {{ .Values.postgres.replicas }}
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      {{- include "evonids.componentSelectorLabels" (dict "ctx" $ "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "evonids.componentLabels" (dict "ctx" $ "component" "postgres") | nindent 8 }}
      annotations:
        checksum/config: {{ include "evonids.configChecksum" . }}
        checksum/secret: {{ include "evonids.secretChecksum" . }}
        {{- with .Values.postgres.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      # Official postgres image runs as uid/gid 999 (postgres).
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: {{ include "evonids.postgresImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "evonids.configName" . }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "evonids.secretName" . }}
                  key: postgres-password
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U {{ .Values.postgres.user }} -d {{ .Values.postgres.database }}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U {{ .Values.postgres.user }} -d {{ .Values.postgres.database }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U {{ .Values.postgres.user }} -d {{ .Values.postgres.database }}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            # readOnlyRootFilesystem stays false here: the postgres entrypoint
            # and runtime need writable /var/run/postgresql, /tmp and the data
            # directory; the data directory itself is a dedicated PVC.
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
        {{- if .Values.postgres.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            {{- if .Values.postgres.persistence.existingClaim }}
            claimName: {{ .Values.postgres.persistence.existingClaim }}
            {{- else }}
            claimName: {{ include "evonids.postgresPvcFullname" . }}
            {{- end }}
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with .Values.postgres.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgres.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ include "evonids.name" . }}
                    app.kubernetes.io/instance: {{ .Release.Name }}
                    app.kubernetes.io/component: postgres
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "evonids.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: postgres
