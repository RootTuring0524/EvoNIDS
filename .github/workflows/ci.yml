name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Per-job path filtering (native GitHub Actions "paths" cannot filter per job).
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - "backend/**"
              - "docker-compose.yml"
              - ".github/workflows/ci.yml"
            frontend:
              - "project/**"
              - "docker-compose.yml"
              - ".github/workflows/ci.yml"

  backend:
    name: Backend (ruff + pytest)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend with dev and ml extras
        # Identical to the local setup command in backend/README.md.
        run: pip install -e ".[dev,ml]"
      - name: Lint with ruff
        # Ruff is configured in backend/pyproject.toml ([tool.ruff], py311, line-length 120).
        run: ruff check .
      - name: Dependency vulnerability audit
        # Known-vulnerability scan for the installed dependency set. continue-on-error
        # keeps advisory noise from blocking merges while the baseline is triaged;
        # remove it once the backlog is clear.
        run: |
          pip install pip-audit
          pip-audit --skip-editable
        continue-on-error: true
      - name: Run tests
        # pytest config lives in backend/pyproject.toml: testpaths = ["tests"], pythonpath = ["."].
        run: pytest -q

  frontend:
    name: Frontend (lint + vitest + build)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: project
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # Auto-reads the pnpm version from the packageManager field of
          # project/package.json (currently pnpm@11.13.1).
          package_json_file: project/package.json
      - name: Set up Node.js
        # project/package.json engines requires node >= 22.0.0.
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: project/pnpm-lock.yaml
      - name: Install dependencies
        # pnpm runs the root "prepare" script (nuxt prepare) during install, which
        # generates project/.nuxt/eslint.config.mjs — imported by project/eslint.config.mjs.
        run: pnpm install --frozen-lockfile
      - name: Lint
        # package.json script "lint" -> "eslint ."
        run: pnpm lint
      - name: Typecheck
        # package.json script "typecheck" -> "nuxt typecheck" (vue-tsc across app/,
        # server/ and shared/); catches contract drift that vitest cannot see.
        run: pnpm typecheck
      - name: Unit tests
        # package.json script "test" -> "vitest run" — already a one-shot runner,
        # so no extra "--run" flag is needed. ("test:watch" is the watch variant
        # and is intentionally NOT used in CI.)
        run: pnpm test
      - name: Build
        # package.json script "build" -> "nuxt build".
        # nuxt.config.ts maps NUXT_PUBLIC_USE_MOCK_API to runtimeConfig.public.useMockApi,
        # so mock mode keeps the build independent of any backend.
        run: pnpm build
        env:
          NUXT_PUBLIC_USE_MOCK_API: "true"
